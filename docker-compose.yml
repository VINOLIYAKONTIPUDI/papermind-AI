version: '3.8'

services:
  # MongoDB database instance
  mongodb:
    image: mongo:6.0
    container_name: papermind_db
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

  # Qdrant Vector Database
  qdrant:
    image: qdrant/qdrant:v1.7.4
    container_name: papermind_vector_db
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  # Express Node API Server
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: papermind_backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/papermind
      - QDRANT_URL=http://qdrant:6333
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=gemini-3.5-flash
      - EMBEDDING_MODEL=gemini-embedding-001
      - EMBEDDING_DIM=768
      - CHUNK_SIZE=1000
      - CHUNK_OVERLAP=200
      - TOP_K=5
      - SIMILARITY_THRESHOLD=0.3
    depends_on:
      - mongodb
      - qdrant
    restart: unless-stopped

  # React Vite Frontend SPA served with Nginx
  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: papermind_frontend
    ports:
      - "5173:80"
    restart: unless-stopped
    depends_on:
      - backend

volumes:
  mongo_data:
  qdrant_data:
